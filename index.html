<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTask1atDay11</title>
    <style>
        .borTes {
            border: 2px solid red;
            box-sizing: border-box;
        }

        .navTop {
            display: block;
            max-width: 1024px;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .headTop {
            display: block;
            width: 100%;
            height: auto;
            background-color: blueviolet;
            padding: 5px 0;
        }

        .TextHead {
            display: block;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .text1 {
            display: inline-block;
            color: #FFFFFF;
            font-size: 12px;
            padding: 0 15px;
            float: left;
        }

        .text2 {
            float: right;
        }

        .bodyNav {
            display: block;
            width: 100%;
            height: 153px;
            background-color: rgb(102, 51, 153);
            clear: both;
        }

        @media(max-width: 768px) {
            .headTop {
                text-align: left;
            }

            .text1 {
                display: inline-block;
                float: none;
                width: auto;
                margin: 5px;
            }

            .text2 {
                float: none;
            }
        }
    </style>
</head>

<body>
    <nav class="navTop borTes">
        <div class="headTop borTes">
            <ul class="TextHead borTes">
                <li class="text1 borTes">Fatawa imam Al muftin</li>
                <li class="text1 text2 borTes">Batam: Kepulauan, Riau Bata Kota</li>
            </ul>
            <div style="clear: both;"></div>
        </div>
        <div class="bodyNav borTes">
        </div>
    </nav>
</body>

</html>
