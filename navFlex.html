<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTask1atDay11 - Flexbox Version</title>
    <style>
        .borTes {
            border: 2px solid red;
            box-sizing: border-box;
        }

        .navTop {
            display: block;
            max-width: 1024px;
            width: 100%;
            margin: 0 auto;
        }

        .headTop {
            background-color: blueviolet;
            padding: 5px 15px;
        }

        .TextHead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .text1 {
            color: #FFFFFF;
            font-size: 12px;
        }

        .bodyNav {
            display: flex;
            width: 100%;
            height: 153px;
            background-color: rgb(102, 51, 153);
        }

        @media(max-width: 768px) {
            .TextHead {
                justify-content: center;
                gap: 15px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <nav class="navTop borTes">
        <div class="headTop borTes">
            <ul class="TextHead borTes">
                <li class="text1 borTes">Fatawa imam Al muftin</li>
                <li class="text1 borTes">Batam: Kepulauan, Riau Bata Kota</li>
            </ul>
        </div>
        <div class="bodyNav borTes">
            <!-- Isi bodyNav -->
        </div>
    </nav>
</body>

</html>
